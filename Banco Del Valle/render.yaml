services:
  - type: web
    name: banco-del-valle
    env: python
    rootDir: Banco Del Valle
    buildCommand: "pip install -r requirements.txt && npm --prefix frontend install && npm --prefix frontend run build"
    startCommand: "python -m uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
