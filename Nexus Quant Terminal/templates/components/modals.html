<!-- MODAL DE DESGLOSE DE CAMPAÑA OPTIMIZADA -->
    <div id="campaign-modal" class="modal" style="display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(5, 8, 15, 0.85); backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 20px;">
        <div class="glass-card" style="background: #0f172a; border: 1.5px solid rgba(255,255,255,0.12); border-radius: 16px; max-width: 920px; width: 100%; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);">
            <!-- Modal Header -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); background: #131d33;">
                <div>
                    <h2 id="campaign-modal-title" style="margin: 0; font-size: 1.25rem; color: #f8fafc; display: flex; align-items: center; gap: 8px;">
                        ⚡ Detalle de Campaña Optimizada
                    </h2>
                    <span id="campaign-modal-subtitle" style="font-size: 0.82rem; color: #94a3b8; display: block; margin-top: 4px;">
                        Auditoría de estrategias evaluadas y filtradas por robustez
                    </span>
                </div>
                <button type="button" onclick="window.closeCampaignModal()" style="background: transparent; border: none; font-size: 1.5rem; color: #94a3b8; cursor: pointer; line-height: 1; padding: 4px 8px;">✕</button>
            </div>
            
            <!-- Modal Body (Strategies List) -->
            <div id="campaign-modal-body" style="padding: 20px 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px;">
                <!-- Dinámicamente poblado con tarjetas de estrategias -->
            </div>
            
            <!-- Modal Footer -->
            <div style="display: flex; justify-content: flex-end; gap: 10px; padding: 14px 24px; border-top: 1px solid rgba(255,255,255,0.08); background: #131d33;">
                <button type="button" class="btn-secondary" onclick="window.closeCampaignModal()" style="padding: 8px 16px; font-size: 0.85rem;">Cerrar</button>
            </div>
        </div>
    </div>
